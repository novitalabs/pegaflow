syntax = "proto3";

package pegaflow;

message ResponseStatus {
  bool ok = 1;
  string message = 2;
}

// H2D/D2H transfer backend the engine uses for an instance's GPU worker pools.
enum TransferMode {
  TRANSFER_MODE_DIRECT = 0;
  TRANSFER_MODE_KERNEL = 1;
}

// Batch registration request for all layers on a GPU (reduces N RPCs to 1).
//
// Workers declare only the layers that actually exist on the device; the
// engine derives the instance-wide layer-id space once all `world_size`
// workers have registered. Fields 7 (num_layers) and 16 (layer_ids) carried
// the connector-guessed topology and are retired.
message RegisterContextRequest {
  reserved 7, 16;
  reserved "num_layers", "layer_ids";

  string instance_id = 1;
  string namespace = 2;
  uint32 tp_rank = 3;
  uint32 tp_size = 4;
  uint32 world_size = 5;
  int32 device_id = 6;
  repeated string layer_names = 8;
  repeated bytes wrapper_bytes = 9;
  repeated uint64 num_blocks = 10;
  repeated uint64 bytes_per_block = 11;
  repeated uint64 kv_stride_bytes = 12;
  repeated uint32 segments = 13;
  uint32 pp_rank = 14;
  string client_version = 15;
  // Transfer backend the connector chose for this instance (kernel for MLA,
  // direct otherwise; overridable via pegaflow.transfer_backend). The engine
  // spawns this instance's GPU worker pools with the requested backend.
  TransferMode transfer_mode = 17;
  // Page-first storage: collapse all layers of a block into one contiguous
  // page per tp_rank, so total_slots = tp_size instead of num_layers * tp_size.
  // Set by the connector for MLA; the engine derives per-layer page offsets
  // from the registered layouts. See spec.md.
  bool page_first = 18;
  // Hybrid-cache storage group per layer, parallel to layer_names (e.g.
  // vLLM's kv-cache group index: 0 = full attention, 1 = recurrent state).
  // Empty means every layer belongs to group 0, preserving single-group
  // behavior. Groups key blocks independently and seal against their own
  // slot space, so a sparse (checkpoint-only) group can seal without
  // attention's per-block cadence. Page-first stays single-group.
  repeated uint32 layer_group_ids = 19;
}

message RegisterContextResponse {
  ResponseStatus status = 1;
}

message SaveLayer {
  string layer_name = 1;
  repeated uint32 block_ids = 2;
  repeated bytes block_hashes = 3;
}

message SaveRequest {
  string instance_id = 1;
  uint32 tp_rank = 2;
  int32 device_id = 3;
  repeated SaveLayer saves = 4;
  uint32 pp_rank = 5;
}

message SaveResponse {
  ResponseStatus status = 1;
}

message LoadRequest {
  string instance_id = 1;
  uint32 tp_rank = 2;
  int32 device_id = 3;
  string load_state_shm = 4;
  repeated LoadGroup groups = 5;
  repeated LeaseLoad loads = 6;
}

message LoadGroup {
  repeated string layer_names = 1;
}

message LoadBlockIds {
  repeated LoadBlockTarget targets = 1;
}

message LoadBlockTarget {
  // Absent for cache groups that have no physical destination for this
  // logical block (for example historical recurrent-state blocks in HMA).
  oneof target {
    uint32 block_id = 1;
  }
}

message LeaseLoad {
  bytes lease = 1;
  repeated LoadBlockIds block_ids_by_group = 2;
}

message LoadResponse {
  ResponseStatus status = 1;
}

message QueryRequest {
  string instance_id = 1;
  repeated bytes block_hashes = 2;
  string req_id = 3;
  // Keep the query in Loading until the full remaining prefix is fetchable
  // from a remote node via MetaServer + RDMA. Does not observe saves landing
  // in the local engine; no effect when RDMA is not configured. On groups > 0
  // this switches the membership query to an all-or-nothing set fetch: the
  // hash list is an exact want-set, misses are pulled from SSD / remote
  // peers, and a Ready answer shorter than the request means the set could
  // not be completed anywhere: callers treat it as a miss, and it carries no
  // lease (the short hit count is reported for observability only).
  bool wait_for_full_prefix = 4;
  // Hybrid-cache storage group to query. 0 (default) is the attention group
  // and uses prefix semantics (hit count + lease over the contiguous prefix,
  // SSD/RDMA prefetch eligible). Groups > 0 use membership semantics: every
  // position reports independently (QueryReady.hit_positions), hits are not
  // prefix-clamped, and the lease pins exactly the hit blocks; local-only
  // unless wait_for_full_prefix requests the remote-fetching set form.
  uint32 group_id = 5;
}

message QueryResponse {
  oneof outcome {
    QueryLoading loading = 1;
    QueryReady ready = 2;
  }
}

message QueryLoading {}

message QueryReady {
  // Prefix query (group_id = 0): number of leading hit blocks.
  // Membership query (group_id > 0): number of hit positions in total.
  uint64 num_hit_blocks = 1;
  // Lease over the hit blocks: the prefix for group 0, or exactly the blocks
  // at hit_positions (in that order) for membership queries. Empty on 0 hits.
  bytes lease = 2;
  // Membership queries only: indices into QueryRequest.block_hashes whose
  // block is cached, in ascending order. The lease's i-th block corresponds
  // to query position hit_positions[i]. Position-aligned so hybrid callers
  // can pick e.g. the rightmost recurrent checkpoint within the attention
  // prefix without a second round trip.
  repeated uint32 hit_positions = 3;
}

message ReleaseRequest {
  bytes lease = 1;
}

message ReleaseResponse {
}

message UnregisterRequest {
  string instance_id = 1;
}

message UnregisterResponse {
  ResponseStatus status = 1;
}

message ShutdownRequest {}

message ShutdownResponse {
  ResponseStatus status = 1;
}

message HealthRequest {}

message HealthResponse {
  ResponseStatus status = 1;
}

// Liveness session: vllm opens a server-streaming RPC at startup and holds
// it for the lifetime of the instance. Server detects client disconnect
// (process death → TCP FIN) and auto-releases the instance's CUDA IPC
// mappings. Stream events are reserved for future server→client hints.
message SessionRequest {
  string instance_id = 1;
}

message SessionEvent {
}

// Cross-node transfer: per-slot RDMA metadata
message TransferSlotInfo {
  uint64 k_ptr = 1;      // Remote pinned memory address for K segment
  uint64 k_size = 2;     // Size of the K segment in bytes (per-segment, not total slot size)
  uint64 v_ptr = 3;      // Remote pinned memory address for V segment (0 if contiguous)
  uint64 v_size = 4;     // Size of the V segment in bytes (0 if contiguous)
  uint32 numa_node = 5;  // NUMA node where this slot's memory resides (for RDMA NIC affinity)
}

// Cross-node transfer: per-block RDMA metadata
message TransferBlockInfo {
  bytes block_hash = 1;
  repeated TransferSlotInfo slots = 2;  // One per TP slot
}

message QueryBlocksForTransferRequest {
  string namespace = 1;
  repeated bytes block_hashes = 2;
  string requester_id = 3;             // For lock tracking / logging
  bool prefix_only = 4;                // Stop at the first missing hash; lock only the contiguous prefix
}

message QueryBlocksForTransferResponse {
  ResponseStatus status = 1;
  repeated TransferBlockInfo blocks = 2;
  string transfer_session_id = 3;       // Opaque session ID for ReleaseTransferLock
  uint32 lock_timeout_secs = 4;         // Server's transfer lock timeout — client must finish before this
}

// RDMA handshake: establish a new RDMA connection between two peers.
// Caller MUST ensure its own side is not-yet-connected and calls are serialized.
// Server invalidates any stale connection for this requester before creating fresh QPs.
message RdmaHandshakeRequest {
  string requester_id = 1;              // Client's advertise address
  bytes handshake_metadata = 2;         // Client's HandshakeMetadata (bincode-serialized)
}

message RdmaHandshakeResponse {
  ResponseStatus status = 1;
  bytes handshake_metadata = 2;         // Server's HandshakeMetadata (bincode-serialized)
}

message ReleaseTransferLockRequest {
  string transfer_session_id = 1;
  // True only when the requester received every block in this session; the
  // holder then demotes its copies to the reclaimable class.
  bool transferred = 2;
}

message ReleaseTransferLockResponse {
  ResponseStatus status = 1;
  uint64 released_blocks = 2;
}

// ---- RPC V2: namespaced, byte-addressed objects ----
//
// An object is keyed by (namespace, prefix), two 32-byte digests the client
// computes. A namespace is one KV kind with all its layers; the server only
// compares its bytes and never branches on what it describes. Each rank
// registers its namespaces and device regions once, then saves and loads the
// bytes of every layer of an object in one span list. The server cuts those
// bytes into one slot per (saver rank, layer), seals the object once every
// slot arrived, and stores it as a KV block, sharing the pinned pool, LRU,
// SSD cache, RDMA fetch and MetaServer with v1.

message DeviceRegion {
  // CUipcMemHandle of a whole cuMemAlloc allocation (64 bytes).
  bytes ipc_handle = 1;
  // Bytes of that allocation. Span offsets count from its start; the client
  // adds where its KV tensor sits inside the allocation.
  uint64 size = 2;
  string name = 3;
}

message NamespaceMeta {
  // 32-byte digest identifying this namespace; equals ObjectKey.namespace of
  // every object saved, queried or loaded under it.
  bytes namespace = 1;
  uint32 world_size = 2;
  // Caller's device and rank; the same in every NamespaceMeta of one request.
  uint32 device_id = 3;
  uint32 rank = 4;
  // Layers of this namespace, in the order spans list them.
  repeated string layer_names = 5;
  // Bytes of one layer of the whole object (one block, full hidden width,
  // K and V together) as stored on the server. Not the per-rank slice and
  // not multiplied by replicas.
  uint64 bytes_per_block = 6;
  // Tokens per block, e.g. 64.
  uint64 block_size = 7;
  // Bytes one rank holds per token in one layer (K and V together).
  // bytes_per_block / (local_hidden * block_size) is the number of slices
  // one layer is split into: 1 means every rank holds a full replica.
  uint64 local_hidden = 8;
  // For DCP. Stored as given; not read by this version.
  uint64 interleave_token = 9;
  // Ranks that write this namespace, e.g. [0, 4] for MLA over two NUMA nodes.
  repeated uint32 saver_rank = 10;
}

message RegisterContextV2 {
  string instance_id = 1;
  repeated NamespaceMeta namespace_meta = 2;
  // One registration may carry several regions. ObjectSpans.region_idx in
  // Save / Load is the index into this list, in registration order.
  repeated DeviceRegion regions = 3;
  string client_version = 4;
  // Not read yet: object copies always use the batch copy kernel.
  TransferMode transfer_mode = 5;
}

message RegisterContextV2Response {
  ResponseStatus status = 1;
}

message ObjectKey {
  // 32-byte digest of everything that decides the object's bytes besides the
  // token prefix (model, state layout, dtype, ...). Must equal the
  // NamespaceMeta.namespace this instance registered.
  bytes namespace = 1;
  // 32-byte digest of the token prefix the object covers.
  bytes prefix = 2;
}

message ObjectSpans {
  ObjectKey key = 1;
  uint32 region_idx = 2;  // index into RegisterContextV2.regions, registration order
  // [offset, len, offset, len, ...] covering every layer of the namespace in
  // layer_names order; within one layer, in the client's own order (e.g. K
  // then V under layer-first). Save and Load of the same key list them in the
  // same order. Each element is exactly 16 bytes: offset u64 LE, len u64 LE,
  // offset counted from the start of the region's allocation.
  repeated bytes span = 3;
}

message SaveObjectsRequest {
  string instance_id = 1;
  uint32 rank = 2;
  repeated ObjectSpans writes = 3;
}

message SaveObjectsResponse {
  ResponseStatus status = 1;
}

message QueryObjectRequest {
  string instance_id = 1;
  // One namespace, in order: prefix queries count from keys[0], membership
  // queries answer indexes into this list.
  repeated ObjectKey keys = 2;
  bool prefix_search = 3;
  // Optional; the server generates one when empty. Poll a Loading answer
  // with the same query_id and keys.
  string query_id = 4;
}

message QueryObjectResponse {
  oneof outcome {
    QueryLoading loading = 1;
    QueryReady ready = 2;
  }
  string query_id = 3;
  ResponseStatus status = 4;
}

message LoadObjectsRequest {
  string instance_id = 1;
  uint32 rank = 2;
  // Must equal the device_id this rank registered.
  uint32 device_id = 3;
  // A LoadState the server sets once the copies finish or fail; the reply
  // comes as soon as the request is checked.
  string load_state_shm = 4;
  repeated ObjectSpans spans = 5;
  // Each lease is consumed once by this request and released after
  // world_size consumes.
  repeated bytes lease = 6;
}

message LoadObjectsResponse {
  ResponseStatus status = 1;
}

service Engine {
  rpc RegisterContextBatch(RegisterContextRequest) returns (RegisterContextResponse);
  rpc Save(SaveRequest) returns (SaveResponse);
  rpc Load(LoadRequest) returns (LoadResponse);
  // Prefetch query: check memory + trigger SSD prefetch or cross-node RDMA fetch for missing blocks
  rpc QueryPrefetch(QueryRequest) returns (QueryResponse);
  rpc Release(ReleaseRequest) returns (ReleaseResponse);
  rpc UnregisterContext(UnregisterRequest) returns (UnregisterResponse);
  // Cross-node transfer: get RDMA metadata for specific blocks (serving side)
  rpc QueryBlocksForTransfer(QueryBlocksForTransferRequest) returns (QueryBlocksForTransferResponse);
  // Cross-node transfer: release block locks after RDMA transfer completes
  rpc ReleaseTransferLock(ReleaseTransferLockRequest) returns (ReleaseTransferLockResponse);
  // RDMA handshake: establish a new peer-to-peer RDMA connection
  rpc RdmaHandshake(RdmaHandshakeRequest) returns (RdmaHandshakeResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  // Liveness channel: server drops the instance's CUDA IPC mappings when
  // this stream closes (vllm process dies or disconnects).
  rpc Session(SessionRequest) returns (stream SessionEvent);
  // RPC V2. The method and the message share the name RegisterContextV2;
  // inside the service scope a bare name resolves to the method first, so
  // the parameter type is fully qualified.
  rpc RegisterContextV2(.pegaflow.RegisterContextV2) returns (RegisterContextV2Response);
  rpc SaveObjects(SaveObjectsRequest) returns (SaveObjectsResponse);
  rpc QueryObject(QueryObjectRequest) returns (QueryObjectResponse);
  rpc LoadObjects(LoadObjectsRequest) returns (LoadObjectsResponse);
}

// MetaServer service for managing block hash keys across multi-node instances
message InsertBlockHashesRequest {
  string namespace = 1;
  repeated bytes block_hashes = 2;
  // The pegaflow-server address that owns these blocks, as ip:port (e.g., "10.0.0.1:50055")
  string node = 3;
  // Server-generated session id announced by HeartbeatNode.
  string node_id = 4;
}

message InsertBlockHashesResponse {
  ResponseStatus status = 1;
  uint64 inserted_count = 2;
  // Hashes for which this node became the configured threshold-or-later
  // live owner (see --min-reclaimable-owner-count). The caller should
  // classify matching local residents as reclaimable.
  repeated bytes reclaimable_hashes = 3;
}

message RemoveBlockHashesRequest {
  string namespace = 1;
  repeated bytes block_hashes = 2;
  // Only remove entries whose current owner matches this node address.
  // Prevents races where node A evicts but node B has since re-registered.
  string node = 3;
  // Server-generated session id announced by HeartbeatNode.
  string node_id = 4;
}

message RemoveBlockHashesResponse {
  ResponseStatus status = 1;
  uint64 removed_count = 2;
}

message QueryPrefixBlocksRequest {
  string namespace = 1;
  repeated bytes block_hashes = 2;  // ordered by prefix position
  string exclude_node = 3;          // requester address; never return it as an owner
  // Membership instead of prefix semantics: hashes no peer holds are skipped
  // rather than ending the plan, and `found` lists the hashes it covers.
  bool members = 4;
}

message FetchSegment {
  string node = 1;
  uint32 block_count = 2;
}

message QueryPrefixBlocksResponse {
  reserved 1;
  reserved "nodes";
  // Over the leading hashes, or with `members` over the `found` ones in order.
  repeated FetchSegment segments = 2;
  // With `members`: ascending indexes into `block_hashes` the segments cover.
  repeated uint32 found = 3;
}

// Block hashes of one namespace, oldest first.
message BackupCandidates {
  string namespace = 1;
  repeated bytes block_hashes = 2;
  // Average resident footprint of these blocks; lets the MetaServer budget
  // backup traffic in bytes across models with different block sizes.
  uint64 block_bytes = 3;
}

message HeartbeatNodeRequest {
  string node = 1;
  string node_id = 2;
  // True while at least one inference instance is registered on this node.
  bool has_instance = 3;
  // Retained LRU-tail blocks this node wants backed up by a decode node.
  // Only sent when the response's backup_enabled was true.
  repeated BackupCandidates backup_candidates = 4;
}

message HeartbeatNodeResponse {
  uint64 stale_after_secs = 1;
  // Decode backup is enabled on this MetaServer.
  bool backup_enabled = 2;
  // This node is a backup target (no instance for the configured delay):
  // it should pull backup plans and must not demote blocks it serves.
  bool backup_target = 3;
  // Reported candidates that already have a live backup owner; the caller
  // should classify matching local residents as reclaimable.
  repeated BackupCandidates backed_hashes = 4;
}

message PullBackupPlanRequest {
  string node = 1;
  string node_id = 2;
  uint64 max_bytes = 3;
}

message PullBackupPlanResponse {
  // Empty when there is nothing to back up.
  string source_node = 1;
  string namespace = 2;
  repeated bytes block_hashes = 3;
}

message UnregisterNodeRequest {
  string node = 1;
  string node_id = 2;
}

message UnregisterNodeResponse {
  uint64 removed_owners = 1;
}

service MetaServer {
  rpc HeartbeatNode(HeartbeatNodeRequest) returns (HeartbeatNodeResponse);
  rpc UnregisterNode(UnregisterNodeRequest) returns (UnregisterNodeResponse);
  rpc InsertBlockHashes(InsertBlockHashesRequest) returns (InsertBlockHashesResponse);
  rpc RemoveBlockHashes(RemoveBlockHashesRequest) returns (RemoveBlockHashesResponse);
  rpc QueryPrefixBlocks(QueryPrefixBlocksRequest) returns (QueryPrefixBlocksResponse);
  rpc PullBackupPlan(PullBackupPlanRequest) returns (PullBackupPlanResponse);
}
